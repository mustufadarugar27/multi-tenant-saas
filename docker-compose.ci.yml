# Overrides for CI – lightweight, no volumes, fast startup
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ci_test
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      BROADCAST_CONNECTION: log
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ci

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci_test
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_secret
    tmpfs:
      - /var/lib/mysql        # RAM-backed – fast, discarded after CI run
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ci

  redis:
    image: redis:7-alpine
    networks:
      - ci

networks:
  ci:
    driver: bridge
